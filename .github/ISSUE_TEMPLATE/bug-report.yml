name: Bug report
description: Report a bug in Momotombo.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Code contributions (pull requests) are not accepted for now; bug reports and suggestions are welcome as Issues.
        Do **not** report security problems here; use the private route described in `SECURITY.md` at the root of the repository.
        Hide personal information before attaching screenshots or videos of your recordings.
  - type: input
    id: version
    attributes:
      label: Momotombo version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.x, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Screenshots, export settings (format, resolution, fps), error messages.
