<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Momotombo</title>
  <desc id="d">Record once — zoom, frame and hide afterwards.</desc>
  <defs>
    <radialGradient id="glowOrange" gradientUnits="userSpaceOnUse" cx="90" cy="-60" r="620">
      <stop offset="0" stop-color="#E84E0F" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#E84E0F" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#E84E0F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" gradientUnits="userSpaceOnUse" cx="1240" cy="-20" r="660">
      <stop offset="0" stop-color="#F07D1A" stop-opacity="0.12"/>
      <stop offset="0.45" stop-color="#F07D1A" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F07D1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLow" gradientUnits="userSpaceOnUse" cx="700" cy="520" r="560">
      <stop offset="0" stop-color="#2D0E00" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#2D0E00" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2D0E00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0.18">
      <stop offset="0" stop-color="#F07D1A"/>
      <stop offset="1" stop-color="#E84E0F"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#050505"/>
  <rect width="1280" height="360" fill="url(#glowOrange)"/>
  <rect width="1280" height="360" fill="url(#glowWarm)"/>
  <rect width="1280" height="360" fill="url(#glowLow)"/>

  <!-- Glass panel -->
  <rect x="120" y="56" width="1040" height="248" rx="28" fill="url(#glass)" stroke="#EBEBEB" stroke-opacity="0.13"/>
  <rect x="160" y="56.5" width="960" height="1" fill="url(#edge)"/>

  <!-- Brand mark: the Momotombo isotype with the record dot (same drawing as the app icon, 150-unit grid) -->
  <g transform="translate(140.2 88.5) scale(1.1733)">
    <g transform="translate(27 52) scale(0.0343839542)">
      <path d="M1324.695,520.395l692.292,820.3l627.342,-0l-1005.899,-1192.005l-313.735,371.704Z" fill="#EBEBEB"/>
      <path d="M185.39,1340.695l1630.37,-0l-815.179,-974.405l-815.191,974.405Z" fill="#E84E0F"/>
    </g>
    <circle cx="103" cy="42" r="10" fill="#E84E0F"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <text x="306" y="168" font-size="80" font-weight="700" fill="#EBEBEB" letter-spacing="-1.5">Momotombo</text>
    <text x="309" y="216" font-size="29" font-weight="600" fill="url(#accentText)">Record once — zoom, frame and hide afterwards.</text>

    <g font-size="15" font-weight="500" fill="#B8B8B8" text-anchor="middle">
      <rect x="309" y="240" width="162" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#EBEBEB" stroke-opacity="0.14"/>
      <text x="390" y="262">macOS &amp; Windows</text>
      <rect x="483" y="240" width="208" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#EBEBEB" stroke-opacity="0.14"/>
      <text x="587" y="262">Auto zoom from clicks</text>
      <rect x="703" y="240" width="146" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#EBEBEB" stroke-opacity="0.14"/>
      <text x="776" y="262">Privacy masks</text>
      <rect x="861" y="240" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#EBEBEB" stroke-opacity="0.14"/>
      <text x="924" y="262">MP4 · WebM</text>
    </g>
  </g>
</svg>
